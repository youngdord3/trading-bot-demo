services:
  reconciler:
    build:
      context: ./core

    command:
      - python
      - check_reconciler_db.py

    restart: "no"
    init: true
    user: "10001:10001"

    environment:
      DB_HOST: postgres
      DB_NAME: trading_demo
      TZ: UTC

    secrets:
      - core_reconciler_db_password

    depends_on:
      postgres:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    networks:
      - backend
